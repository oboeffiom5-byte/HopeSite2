<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Our Story{% endblock %} ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body {% block bodyattr %}{% endblock %}>
<nav class="nav" aria-label="Main">
  <a href="{{ url_for('login') }}">Home</a>
  <a href="{{ url_for('loveStory') }}" {% if request.endpoint == 'loveStory' %}class="on"{% endif %}>Our Story</a>
  <a href="{{ url_for('letter') }}" {% if request.endpoint == 'letter' %}class="on"{% endif %}>My Letter</a>
</nav>
<audio id="backgroundMusic" loop preload="auto"><source src="{{ url_for('static', filename='music.mp3') }}" type="audio/mpeg"></audio>
<button class="music-control" id="musicButton" aria-label="Play music">♪</button>
{% block content %}{% endblock %}
<footer class="foot">Made with <span>♥</span> especially for Hope.</footer>
<script src="{{ url_for('static', filename='js/site.js') }}"></script>
<script src="{{ url_for('static', filename='js/music.js') }}"></script>
</body>
</html>
